<main class="pagina-login">
  <h1>Iniciar sesión</h1>
  <p>Acceso simulado para el taller de Routing.</p>

  <form (ngSubmit)="iniciarSesion()">
    <label for="usuario">Usuario</label>
    <input
      id="usuario"
      name="usuario"
      type="text"
      autocomplete="username"
      [(ngModel)]="usuario"
      required
    >

    <label for="clave">Contraseña</label>
    <input
      id="clave"
      name="clave"
      type="password"
      autocomplete="current-password"
      [(ngModel)]="clave"
      required
    >

    <p *ngIf="mensajeError" class="mensaje-error" role="alert">
      {{ mensajeError }}
    </p>

    <button type="submit">Ingresar</button>
  </form>

  <a routerLink="/productos">Volver al catálogo</a>
</main>
